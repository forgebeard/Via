[alembic]
script_location = alembic
prepend_sys_path = . src
version_path_separator = os

# Приоритет: переменная окружения DATABASE_URL (см. alembic/env.py).
# Запасной URL ниже — только если DATABASE_URL пуст.
# Локальный Postgres (часто совпадает с docker-compose: POSTGRES_USER=bot, POSTGRES_DB=via).
# Замените пароль на свой, если отличается; не коммитьте прод-секреты.
sqlalchemy.url = postgresql://bot:9gkYZbqfrhNxrGtZokocILFhA56dv9g97F78Xw_qojw@127.0.0.1:5433/via

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
